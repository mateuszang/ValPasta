<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | SGM ValPasta</title>
  <link rel="icon" href="img/logo_reciclagem.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-pagina">
  <div class="login-card">
    <img src="img/logo.png" alt="ValPasta">
    <h1>Gestão de Manutenção</h1>
    <p class="sub">Entre com seu e-mail e senha</p>
    <form id="form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" type="password" autocomplete="current-password" required>
        <button type="button" class="olho" id="olho" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
          <svg id="olhoAberto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="olhoFechado" class="oculto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a17.6 17.6 0 0 1 4.1-5M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-2.2 3.2M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
        </button>
      </div>
      <p class="erro-form" id="erro" role="alert"></p>
      <button class="btn verde" style="width:100%;margin-top:6px" id="entrar">Entrar</button>
    </form>
    <div class="demo">
      <b>Contas de demonstração</b> (senha 123456)<br>
      gerente@valpasta.com · tecnico@valpasta.com · operador@valpasta.com
    </div>
  </div>
<script>
  document.getElementById('olho').addEventListener('click', () => {
    const mostrar = senha.type === 'password';
    senha.type = mostrar ? 'text' : 'password';
    olhoAberto.classList.toggle('oculto', mostrar);
    olhoFechado.classList.toggle('oculto', !mostrar);
    olho.setAttribute('aria-pressed', mostrar);
    olho.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
    olho.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
    senha.focus();
});
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro'), btn = document.getElementById('entrar');
    erro.textContent = ''; btn.disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, senha: senha.value }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erro || 'Não foi possível entrar');
      localStorage.setItem('token', d.token);
      localStorage.setItem('user', JSON.stringify(d.user));
      const destino = sessionStorage.getItem('destino');   // ex.: veio de um QR Code
      sessionStorage.removeItem('destino');
      location.replace('app.html' + (destino || ''));
    } catch (err) { erro.textContent = err.message; btn.disabled = false; }
  });
</script>
</body>
</html>
